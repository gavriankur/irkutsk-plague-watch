name: Check WHO CDC and publish
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'site/**'
      - 'data/sources.json'
permissions:
  contents: read
concurrency:
  group: official-source-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Test source isolation and count preservation
        run: python -m unittest discover -s tests -v
      - name: Check official sources
        run: python scripts/update_sources.py
      - name: Build public snapshot
        run: python scripts/build.py
      - name: Save monitoring history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/sources.json site
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh WHO CDC source checks'
            git push
          fi
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          d=json.loads(Path('data/sources.json').read_text())
          v=json.loads(Path('data/reviewed.json').read_text())
          pending=any(v['approved_source_hashes'].get(r['url']) != r['content_hash'] for r in d['reports'])
          print('WHO / CDC checks completed. Case-count review required:', pending)
          print('Failed source checks:', sum(not c['ok'] for c in d['checks']))
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
